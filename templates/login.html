<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SalaryScope</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg-color: #eef1f5;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;

            --neu-raised:
                6px 6px 14px rgba(166, 180, 200, 0.45),
                -6px -6px 14px rgba(255, 255, 255, 0.95);

            --neu-inset:
                inset 3px 3px 6px rgba(166, 180, 200, 0.35),
                inset -3px -3px 6px rgba(255, 255, 255, 0.85);

            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI",
                         Roboto, Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 38px 36px;
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: var(--radius);
            box-shadow: var(--neu-raised);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
            color: var(--text-main);
            font-size: 21px;
            font-weight: 750;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--accent-blue);
            box-shadow: var(--neu-raised);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .login-title {
            margin-bottom: 9px;
            color: var(--text-main);
            font-size: 30px;
            font-weight: 750;
            letter-spacing: -0.8px;
        }

        .login-description {
            margin-bottom: 28px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .form-label {
            margin-bottom: 9px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 650;
        }

        .form-control {
            min-height: 48px;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 11px;
            background: var(--bg-color);
            color: var(--text-main);
            box-shadow: var(--neu-inset);
            font-size: 14px;
        }

        .form-control::placeholder {
            color: #8a96a8;
        }

        .form-control:focus {
            background: var(--bg-color);
            color: var(--text-main);
            border-color: rgba(37, 99, 235, 0.55);
            box-shadow:
                var(--neu-inset),
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 11px;
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 4px 4px 10px rgba(37, 99, 235, 0.22);
            font-size: 15px;
            font-weight: 650;
            transition: background 0.2s ease,
                        transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .login-button:hover {
            background: var(--accent-hover);
            color: #ffffff;
            box-shadow: 5px 5px 12px rgba(37, 99, 235, 0.28);
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: var(--neu-inset);
        }

        .register-text {
            margin: 25px 0 0;
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        .register-text a {
            color: var(--accent-blue);
            font-weight: 650;
            text-decoration: none;
        }

        .register-text a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
            }

            .brand {
                margin-bottom: 28px;
            }

            .login-title {
                font-size: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <a href="{% url 'home' %}" class="brand">
            <span class="brand-icon" aria-hidden="true">
                <svg width="21" height="21"
                     viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="20" x2="12" y2="10"></line>
                    <line x1="18" y1="20" x2="18" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="16"></line>
                </svg>
            </span>
            SalaryScope
        </a>

        <a href="{% url 'home' %}" class="back-link">
            &larr; Back to Home
        </a>

        <h1 class="login-title">Welcome Back</h1>

        <p class="login-description">
            Log in to access your SalaryScope account and saved predictions.
        </p>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}"
                     role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>
        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </main>

</body>
</html>
