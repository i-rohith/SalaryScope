<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SalaryScope</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f3f6fb;
            color: #172033;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 15px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 565px;
            margin-top: 0;
            padding: 52px 54px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(25, 45, 75, 0.08);
        }

        .back-link {
            display: inline-block;
            color: #0d6efd;
            text-decoration: none;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .login-title {
            color: #173d73;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-description {
            color: #68758a;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #d8dfeb;
            border-radius: 8px;
            padding: 10px 13px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .login-button {
            width: 100%;
            min-height: 52px;
            margin-top: 12px;
            background-color: #0d6efd;
            border: none;
            border-radius: 9px;
            color: #ffffff;
            font-size: 19px;
            font-weight: 500;
        }

        .login-button:hover {
            background-color: #0b5ed7;
        }

        .register-text {
            text-align: center;
            margin-top: 28px;
            margin-bottom: 0;
        }

        .register-text a {
            color: #0d6efd;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 32px 24px;
                margin-top: 10px;
            }

            .login-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <a href="{% url 'home' %}" class="back-link">
            &larr; Back to Home
        </a>

        <h1 class="login-title">Welcome Back</h1>

        <p class="login-description">
            Log in to access your SalaryScope account and saved predictions.
        </p>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>
        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </main>

</body>
</html>
